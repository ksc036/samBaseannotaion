<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>micro-sam point segmentation</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>micro-sam point segmentation</h1>
        <p>Positive/negative point prompts to mask</p>
      </div>
      <label class="fileButton">
        Open image
        <input id="fileInput" type="file" accept=".png,.jpg,.jpeg,.tif,.tiff" />
      </label>
    </header>

    <main>
      <aside>
        <div class="controlGroup">
          <button id="positiveBtn" class="active positive">Positive</button>
          <button id="negativeBtn" class="negative">Negative</button>
        </div>
        <div class="controlGroup">
          <button id="brushBtn" class="editTool">Brush</button>
          <button id="eraserBtn" class="editTool">Eraser</button>
        </div>
        <button id="segmentBtn">Segment Object</button>
        <button id="calculateBtn">Calculate</button>
        <button id="clearBtn">Clear Points</button>
        <label class="metricLabel" for="pixelSizeInput">Pixel size</label>
        <div class="scaleRow">
          <input id="pixelSizeInput" type="number" min="0" step="any" placeholder="actual distance / pixel" />
          <input id="pixelUnitInput" type="text" value="um" placeholder="unit" />
        </div>
        <label class="metricLabel" for="brushSize">Brush size</label>
        <input id="brushSize" type="range" min="4" max="64" value="18" />
        <div id="brushSizeValue">18 px</div>
        <a id="maskDownload" class="disabled" download="mask.png">Mask Download</a>
        <div id="status">Open a microscopy image to start.</div>
        <div id="pointListWrap">
          <ul id="pointList"></ul>
        </div>
        <div id="resultsPanel">
          <h2>Segment Measurements</h2>
          <div id="resultsTableWrap">
            <table id="resultsTable">
              <thead>
                <tr>
                  <th>Color</th>
                  <th>Segment</th>
                  <th id="areaHeader">Area (px²)</th>
                  <th id="feretMaxHeader">Feret max (px)</th>
                  <th id="feretMinHeader">Min Feret (px)</th>
                  <th id="eqDiameterHeader">Eq. diameter (px)</th>
                  <th id="bboxWidthHeader">BBox W (px)</th>
                  <th id="bboxHeightHeader">BBox H (px)</th>
                </tr>
              </thead>
              <tbody id="resultsBody">
                <tr>
                  <td colspan="8" class="emptyCell">No calculation yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </aside>

      <section id="stageWrap">
        <canvas id="stage"></canvas>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
